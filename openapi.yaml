openapi: 3.1.0
info:
  title: AI UNLIMITED AGENTS API
  version: 0.1.0
  description: Multi-provider agent API for a ChatGPT Custom GPT Action.
servers:
  - url: https://YOUR-DEPLOYED-API.example.com
paths:
  /health:
    get:
      operationId: health
      summary: Check API health
      responses:
        "200":
          description: API is healthy
  /v1/agents:
    get:
      operationId: listAgents
      summary: List available specialist agents and configured providers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Agent and provider list
  /v1/chat:
    post:
      operationId: runAgentTask
      summary: Send a task to the multi-agent AI service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: User task or question
                role:
                  type: string
                  enum: [research, coding, analysis, writing, review]
                provider:
                  type: string
                  description: Configured provider name, or auto
                system:
                  type: string
                  description: Optional task-specific system instruction
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  orchestration:
                    type: object
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "503":
          description: Provider unavailable or not configured
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
